# ============================================================================
# Talend microservice runtime configuration (application.properties)
#
# Default content of the project setting:
#   Project Settings > Build > Standalone Microservices
#     > "Microservices application properties file"
#   (preference key: ms_standalone_application_properties)
#
# This file is shared by every microservice built from the project. Each
# parameter below is tagged with the service type(s) it applies to:
#   [ALL]  - applies to all microservices (REST and SOAP)
#   [REST] - applies to REST microservices only
#   [SOAP] - applies to SOAP microservices only
# ============================================================================

# [ALL] Location of the startup banner printed in the console.
banner.location=classpath:/config/banner.txt

# --- Embedded HTTP server (Jetty) -------------------------------------------
# [ALL] Protocol (http/https), bind address and listen port of the server.
server.protocol=http
# keep it as 0.0.0.0 for docker container
server.host=0.0.0.0
server.port=8065
# [ALL] Base context path the CXF servlet is mounted on. Both REST (JAX-RS) and
# SOAP (JAX-WS) endpoints are published below this path, e.g.
# http://<host>:<port>/services/<endpoint>.
server.servlet.context-path=/services

# [ALL] Location of the logging (log4j2) configuration file.
logging.config=classpath:config/log4j2.xml

# --- Management / monitoring ------------------------------------------------
# [ALL] Base path and the actuator endpoints exposed for monitoring
# (health, info, metrics, ...).
management.server.base-path=/
management.endpoints.web.exposure.include=info,health,jolokia,prometheus

# [ALL] Expose Java runtime information on the info endpoint.
management.info.java.enabled=true

# [ALL] Default credentials protecting the management endpoints. The same
# credentials are reused for SOAP service security, so SOAP microservices do
# not need their own credentials.
security.user.name=${MS_SECURITY_USER_NAME:#{null}}
security.user.password=${MS_SECURITY_USER_PASSWORD:#{null}}

# [ALL] SSL configuration (disabled by default).
#security.require-ssl=false
#server.ssl.key-store=dispatchJob/src/main/resources/config/keystore.jks
#server.ssl.key-store-type=JKS
#server.ssl.key-store-password=sspass
#server.ssl.key-store-alias=servicekey

#server.ssl.client-auth=need

# [ALL] SSL truststore configuration (disabled by default).
#server.ssl.trust-store=server-truststore.jks
#server.ssl.trust-store-password=password
#server.ssl.trust-store-type=JKS

# [ALL] Embedded Jetty thread pool sizing.
jetty.threadPool.maxThreads=200
jetty.threadPool.minThreads=8
#jetty.threadPool.threadNamePrefix=JettyThread

# [ALL] Server access (request) log settings (disabled by default).
#server.requestlog.enabled=false
#server.requestlog.append=true
#server.requestlog.file=request.log
#server.requestlog.retaindays=1
#server.requestlog.format=%{client}a - %u %t "%r" %s %O "%{Referer}i" "%{User-Agent}i"

# --- SOAP (JAX-WS) specific -------------------------------------------------
# [SOAP] Parameters below are reserved for SOAP microservices. They share the
# same HTTP server and base path as REST (server.servlet.context-path above);
# SOAP endpoints are published as <context-path>/<service>?wsdl. SOAP service
# security reuses the shared security.user.* credentials defined above. The
# entries are documented for the SOAP microservice build and are commented out
# (no effect until the build consumes them).

# [SOAP] Publish the WSDL and the CXF service-list page under the base path.
#soap.wsdl.publish=true
#soap.service-list.hide=false
